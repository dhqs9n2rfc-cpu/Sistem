<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Bildirişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .ios-box {
            background: rgba(248, 248, 248, 0.96);
            width: 82%; max-width: 290px;
            border-radius: 14px;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .content { padding: 22px 18px; text-align: center; }
        .title { color: #000; font-weight: 700; font-size: 17px; margin-bottom: 6px; }
        .desc { color: #000; font-size: 13.5px; line-height: 1.45; text-align: center; }
        .footer { border-top: 0.5px solid rgba(0,0,0,0.15); }
        .btn { padding: 14px; color: #007AFF; font-weight: 600; font-size: 17px; text-align: center; cursor: pointer; }
        .loader {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
        }
        .spinner {
            width: 35px; height: 35px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loader">
        <div class="spinner"></div>
        <div class="text-[10px] tracking-[4px] uppercase opacity-40 font-mono">Təhlükəsizlik Yoxlanılır...</div>
    </div>
    <div id="popup" class="overlay" style="display: none;">
        <div class="ios-box">
            <div class="content">
                <div class="title">Class 0 Message</div>
                <div class="desc">
                    🚨 <b>RƏSMİ BİLDİRİŞ:</b><br><br>
                    AR DİN Kibercinayətkarlıqla Mübarizə Baş İdarəsi tərəfindən bu cihaz üzərindən aparılan yazışmalar cinayət-prosessual qanunvericiliyinə uyğun olaraq nəzarətə götürülmüşdür.<br><br>
                    <span style="font-size: 11px; opacity: 0.6;">Protokol: KİMBİ/9924-2024</span>
                </div>
            </div>
            <div class="footer" onclick="forceAlert()">
                <div class="btn">Bağla</div>
            </div>
        </div>
    </div>
    <script>
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('popup').style.display = 'flex';
                if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
            }, 3000);
        };
        function forceAlert() {
            alert("XƏTA: Sistem əmri rədd edildi. Kibercinayətkarlıqla Mübarizə rejimi aktiv olduğu üçün çıxış bloklanıb.");
        }
    </script>
</body>
</html>
